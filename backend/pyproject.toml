[project]
name = "platybill-backend"
version = "0.0.0"
description = "Platybill backend — FastAPI + SQLAlchemy + Alembic"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "httpx>=0.28",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "bcrypt>=4.3.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
    "apscheduler>=3.11",
    "starlette>=1.3.1",
    "pyasn1>=0.6.4",
    "pypdf>=6.20.0",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pandas-stubs>=2.0",
    "psycopg2-binary>=2.9.12",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["alembic/*", "tests/*"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
